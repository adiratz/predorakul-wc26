<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Picks — FPL WC26</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
 
<nav class="nav">
  <div class="nav__inner">
    <div class="nav__brand">
      <span class="nav__title">FPL WC26</span>
      <span class="nav__tagline">Become a Predorakul</span>
    </div>
    <div class="nav__links" id="nav-links"></div>
    <div class="nav__player" id="nav-player"></div>
  </div>
</nav>
 
<main class="container" style="padding-top:32px; padding-bottom:40px;">
 
  <div class="page-header" style="text-align:left; padding-top:0;">
    <h1>TOURNAMENT<br><em>PICKS</em></h1>
    <p>Who does everyone think will win the World Cup?</p>
  </div>
 
  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Loading picks...
  </div>
 
  <!-- Picks content -->
  <div id="picks-wrap" style="display:none;"></div>
 
</main>
 
<nav class="mobile-nav">
  <div class="mobile-nav__links" id="mobile-nav-links"></div>
</nav>
 
<div class="toast-container" id="toast-container"></div>
 
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  const player = await requireAuth();
  if (!player) return;
  setupNav('picks');
  await loadPicks();
});
 
async function loadPicks() {
  try {
    const res = await API.get({ action: 'getPicks' });
    if (!res.success) throw new Error('Failed to load picks');
 
    document.getElementById('loading').style.display = 'none';
    document.getElementById('picks-wrap').style.display = 'block';
 
    renderPicks(res.picks, res.deadlinePassed);
  } catch (err) {
    document.getElementById('loading').innerHTML =
      '<div style="color:var(--red)">Failed to load picks. Please refresh.</div>';
  }
}
 
function renderPicks(picks, deadlinePassed) {
  const wrap = document.getElementById('picks-wrap');
 
  if (!deadlinePassed) {
    wrap.innerHTML += `
      <div class="card mb-24" style="background:rgba(77,159,255,0.05); border-color:rgba(77,159,255,0.2);">
        <div style="color:var(--blue); font-weight:600; margin-bottom:4px;">🔒 Picks revealed after kickoff</div>
        <div style="color:var(--text2); font-size:0.875rem;">
          Tournament winner picks are hidden until Match 1 kicks off (June 11, 19:00 UTC).
          You can see who has submitted, but not what they picked.
        </div>
      </div>`;
  } else {
    wrap.innerHTML += `
      <div class="card mb-24" style="background:rgba(245,200,66,0.05); border-color:rgba(245,200,66,0.2);">
        <div style="color:var(--gold); font-weight:600; margin-bottom:4px;">🏆 Picks revealed!</div>
        <div style="color:var(--text2); font-size:0.875rem;">
          The deadline has passed. Here's who everyone is backing for the World Cup trophy.
        </div>
      </div>`;
  }
 
  if (picks.length === 0) {
    wrap.innerHTML += `<div class="empty-state"><h3>No picks yet</h3><p>Players haven't submitted their tournament winner predictions yet.</p></div>`;
    return;
  }
 
  // Group picks by team if revealed
  if (deadlinePassed) {
    const teamGroups = {};
    picks.forEach(p => {
      const team = p.pick || '—';
      if (!teamGroups[team]) teamGroups[team] = [];
      teamGroups[team].push(p.player);
    });
 
    // Sort by number of picks
    const sorted = Object.entries(teamGroups).sort((a, b) => b[1].length - a[1].length);
 
    wrap.innerHTML += `
      <div style="margin-bottom:32px;">
        <div style="font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:var(--text3); margin-bottom:12px;">
          By Team
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${sorted.map(([team, players]) => `
            <div class="card" style="display:flex; align-items:center; justify-content:space-between; padding:14px 20px;">
              <div>
                <div style="font-family:var(--font-display); font-size:1.2rem; letter-spacing:0.05em; color:${team !== '—' ? 'var(--gold)' : 'var(--text3)'}">
                  ${escHtml(team)}
                </div>
                <div style="font-size:0.8rem; color:var(--text2); margin-top:2px;">
                  ${players.map(p => escHtml(p)).join(', ')}
                </div>
              </div>
              <div style="font-family:var(--font-display); font-size:2rem; color:${team !== '—' ? 'var(--gold)' : 'var(--text3)'}; letter-spacing:0.05em;">
                ${players.length}
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }
 
  // Individual cards
  wrap.innerHTML += `
    <div style="font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:var(--text3); margin-bottom:12px;">
      ${deadlinePassed ? 'Everyone\'s pick' : 'Submission status'}
    </div>
    <div class="picks-grid">
      ${picks.map(p => `
        <div class="pick-card">
          <div class="pick-player">${escHtml(p.player)}</div>
          <div class="${p.pick && p.pick !== '—' ? 'pick-team' : 'pick-team pick-team--hidden'}">
            ${escHtml(p.pick || '—')}
          </div>
        </div>
      `).join('')}
    </div>`;
}
</script>
</body>
</html>
