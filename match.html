<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Centre — FPL WC26</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Match Centre styles ── */
    .mc-page-intro {
      color: var(--text2);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .mc-filter {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: var(--surface);
      padding: 4px;
      border-radius: var(--radius2);
      border: 1px solid var(--border);
      width: fit-content;
    }

    .mc-filter-btn {
      padding: 7px 18px;
      border-radius: var(--radius);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text2);
      transition: all var(--transition);
    }

    .mc-filter-btn.active {
      background: var(--gold);
      color: #0a0e1a;
    }

    .mc-filter-btn:hover:not(.active) {
      color: var(--text);
      background: var(--surface2);
    }

    /* ── Day group ── */
    .mc-day {
      margin-bottom: 32px;
    }

    .mc-day-label {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: var(--text2);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mc-day-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Match card ── */
    .mc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* ── Match header ── */
    .mc-match-header {
      background: var(--bg2);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      cursor: pointer;
      user-select: none;
    }

    .mc-match-header:hover {
      background: var(--bg3);
    }

    .mc-match-id {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text3);
      background: var(--surface);
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .mc-match-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .mc-match-title .vs {
      color: var(--text3);
      font-size: 0.8rem;
      margin: 0 6px;
    }

    .mc-match-time {
      font-size: 0.78rem;
      color: var(--text3);
      white-space: nowrap;
    }

    .mc-chevron {
      color: var(--text3);
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .mc-card.expanded .mc-chevron {
      transform: rotate(180deg);
    }

    /* ── Result block ── */
    .mc-result-block {
      background: linear-gradient(135deg, rgba(245,200,66,0.06) 0%, rgba(245,200,66,0.02) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .mc-result-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .mc-result-main {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .mc-result-winner {
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      color: var(--gold);
    }

    .mc-result-score {
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      color: var(--text);
      background: var(--surface2);
      padding: 4px 12px;
      border-radius: var(--radius);
    }

    .mc-result-arrow {
      color: var(--text3);
      font-size: 0.8rem;
    }

    .mc-result-aet {
      font-size: 0.82rem;
      color: var(--blue);
    }

    .mc-result-pens {
      font-size: 0.82rem;
      color: var(--platinum);
    }

    .mc-result-scorers {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text2);
      line-height: 1.5;
    }

    .mc-result-scorers span {
      color: var(--text3);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 6px;
    }

    .mc-awaiting {
      padding: 12px 20px;
      font-size: 0.82rem;
      color: var(--text3);
      font-style: italic;
    }

    /* ── Predictions table ── */
    .mc-body {
      display: none;
      padding: 0;
    }

    .mc-card.expanded .mc-body {
      display: block;
    }

    .mc-table {
      width: 100%;
      border-collapse: collapse;
    }

    .mc-table th {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      white-space: nowrap;
    }

    .mc-table th.right { text-align: right; }

    .mc-table td {
      padding: 12px 16px;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .mc-table tr:last-child td { border-bottom: none; }
    .mc-table tr:hover td { background: var(--surface2); }

    .mc-player-name {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .mc-player-name.is-me {
      color: var(--gold);
    }

    .mc-pred-winner {
      font-weight: 600;
      color: var(--text);
    }

    .mc-pred-winner.correct { color: var(--green); }
    .mc-pred-winner.incorrect { color: var(--red); }

    .mc-pred-score {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .mc-pred-score.correct { color: var(--green); }

    .mc-pred-scorers {
      font-size: 0.78rem;
      color: var(--text2);
      line-height: 1.5;
      max-width: 200px;
    }

    .mc-pred-aet {
      font-size: 0.8rem;
      color: var(--blue);
    }

    .mc-pred-aet.correct { color: var(--green); }

    .mc-pred-pens {
      font-size: 0.8rem;
      color: var(--platinum);
    }

    .mc-empty {
      color: var(--text3);
      font-style: italic;
    }

    .mc-pts {
      font-weight: 700;
      font-size: 1rem;
      text-align: right;
      white-space: nowrap;
    }

    .mc-pts-pos { color: var(--green); }
    .mc-pts-zero { color: var(--text3); }
    .mc-pts-pending { color: var(--text3); font-style: italic; font-size: 0.78rem; font-weight: 400; }

    .mc-pp-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .mc-pp-silver { background: rgba(170,180,190,0.2); color: #aab4be; }
    .mc-pp-golden { background: rgba(245,200,66,0.15); color: var(--gold); }
    .mc-pp-platinum { background: rgba(0,229,255,0.15); color: var(--platinum); }

    /* ── No matches state ── */
    .mc-no-matches {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }

    .mc-no-matches h3 {
      color: var(--text2);
      margin-bottom: 8px;
    }

    /* ── Loading ── */
    .mc-loading-row td {
      text-align: center;
      padding: 20px;
      color: var(--text3);
      font-style: italic;
    }

    @media (max-width: 640px) {
      .mc-table th.hide-mobile,
      .mc-table td.hide-mobile {
        display: none;
      }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav__inner">
    <div class="nav__brand">
      <span class="nav__title">FPL WC26</span>
      <span class="nav__tagline">Become a Predorakul</span>
    </div>
    <div class="nav__links" id="nav-links"></div>
    <div class="nav__player" id="nav-player"></div>
  </div>
</nav>

<main class="container--wide" style="padding-top:32px; padding-bottom:40px;">

  <div class="page-header" style="text-align:left; padding-top:0; margin-bottom:8px;">
    <h1>MATCH <em>CENTRE</em></h1>
  </div>
  <p class="mc-page-intro">Predictions revealed after each match kicks off. Click a match to expand.</p>

  <div class="mc-filter">
    <button class="mc-filter-btn active" onclick="setFilter('all', this)">All Matches</button>
    <button class="mc-filter-btn" onclick="setFilter('scored', this)">Scored</button>
    <button class="mc-filter-btn" onclick="setFilter('pending', this)">Awaiting Result</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    Loading match data...
  </div>

  <div id="mc-content" style="display:none;"></div>

</main>

<nav class="mobile-nav">
  <div class="mobile-nav__links" id="mobile-nav-links"></div>
</nav>

<div class="toast-container" id="toast-container"></div>

<script src="js/results-cache.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let matchData = {};
let playerList = [];
let myName = '';
let allLockedFixtures = [];
let currentFilter = 'all';

window.addEventListener('DOMContentLoaded', async () => {
  const player = await requireAuth();
  if (!player) return;
  myName = player.name;
  setupNav('matches');
  await loadPage();
});

async function loadPage() {
  const now = new Date();

  // Get all locked fixtures from hardcoded data
  allLockedFixtures = HARDCODED_FIXTURES.filter(f =>
    now >= new Date(f.kickoffUTC.replace(' ', 'T') + 'Z')
  );

  // Also check dynamic fixtures (semis/final)
  try {
    const dynRes = await API.get({ action: 'getFixtures', dynamicOnly: 'true' });
    if (dynRes.success && dynRes.fixtures) {
      const dynLocked = dynRes.fixtures.filter(f =>
        f.matchId >= DYNAMIC_FROM_MATCH_ID &&
        now >= new Date(f.kickoffUTC.replace(' ', 'T') + 'Z')
      );
      allLockedFixtures = [...allLockedFixtures, ...dynLocked];
    }
  } catch(e) {}

  document.getElementById('loading').style.display = 'none';
  document.getElementById('mc-content').style.display = 'block';

  if (allLockedFixtures.length === 0) {
    document.getElementById('mc-content').innerHTML = `
      <div class="mc-no-matches">
        <h3>No matches locked yet</h3>
        <p>Match Centre shows predictions after each match kicks off.<br>
        Check back after the first match on June 11.</p>
      </div>`;
    return;
  }

  // Load data for all locked fixtures
  await loadMatchData(allLockedFixtures);
  renderAll();
}

async function loadMatchData(fixtures) {
  const uncachedIds = [];

  // Check cache first
  if (typeof RESULTS_CACHE !== 'undefined') {
    fixtures.forEach(f => {
      if (RESULTS_CACHE[f.matchId]) {
        matchData[f.matchId] = RESULTS_CACHE[f.matchId];
      } else {
        uncachedIds.push(f.matchId);
      }
    });
  } else {
    fixtures.forEach(f => uncachedIds.push(f.matchId));
  }

  // Fetch uncached from API in one call
  if (uncachedIds.length > 0) {
    try {
      const res = await API.get({
        action: 'getMatchPredictions',
        matchIds: uncachedIds.join(',')
      });
      if (res.success) {
        Object.assign(matchData, res.data);
        if (res.players && res.players.length > 0) playerList = res.players;
      }
    } catch(e) {
      console.warn('Could not load match predictions:', e.message);
    }
  }

  // Build player list from cache if not set by API
  if (playerList.length === 0) {
    const firstCached = Object.values(matchData)[0];
    if (firstCached && firstCached.players) {
      playerList = Object.keys(firstCached.players);
    }
  }
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.mc-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function filterFixtures(fixtures) {
  if (currentFilter === 'scored') {
    return fixtures.filter(f => {
      const d = matchData[f.matchId];
      return d && d.result && d.result.winner;
    });
  }
  if (currentFilter === 'pending') {
    return fixtures.filter(f => {
      const d = matchData[f.matchId];
      return !d || !d.result || !d.result.winner;
    });
  }
  return allLockedFixtures;
}

function renderAll() {
  const content = document.getElementById('mc-content');
  const filtered = filterFixtures(allLockedFixtures);

  if (filtered.length === 0) {
    content.innerHTML = `<div class="mc-no-matches"><h3>No matches in this filter</h3></div>`;
    return;
  }

  // Group by local date
  const groups = {};
  filtered.forEach(f => {
    const key = formatDate(f.kickoffUTC);
    if (!groups[key]) groups[key] = [];
    groups[key].push(f);
  });

  let html = '';
  Object.entries(groups).forEach(([dateLabel, fixtures]) => {
    html += `<div class="mc-day"><div class="mc-day-label">${dateLabel}</div>`;
    fixtures.forEach(f => { html += renderMatchCard(f); });
    html += '</div>';
  });

  content.innerHTML = html;
}

function renderMatchCard(fixture) {
  const { matchId, home, away, kickoffUTC } = fixture;
  const data = matchData[matchId] || { result: null, players: {} };
  const result = data.result || null;
  const hasResult = !!(result && result.winner);
  const isKnockout = matchId > 72;
  const hasAET = hasResult && result.aetScore && result.aetScore !== '';
  const hasPens = hasResult && result.pensScore && result.pensScore !== '';

  // Result block
  let resultHtml = '';
  if (hasResult) {
    let scoreLine = `
      <div class="mc-result-main">
        <div class="mc-result-winner">${escHtml(result.winner)}</div>
        <div class="mc-result-score">${escHtml(result.score || '—')}</div>`;

    if (hasAET) {
      scoreLine += `
        <div class="mc-result-arrow">→</div>
        <div class="mc-result-aet">AET ${escHtml(result.aetScore)}</div>`;
    }
    if (hasPens) {
      scoreLine += `
        <div class="mc-result-arrow">→</div>
        <div class="mc-result-pens">Pens ${escHtml(result.pensScore)}</div>`;
    }
    scoreLine += '</div>';

    let scorersHtml = '';
    if (result.scorers) {
      scorersHtml += `<div class="mc-result-scorers"><span>90 min</span>${escHtml(result.scorers)}</div>`;
    }
    if (hasAET && result.etScorers) {
      scorersHtml += `<div class="mc-result-scorers"><span>ET</span>${escHtml(result.etScorers)}</div>`;
    }

    resultHtml = `
      <div class="mc-result-block">
        <div class="mc-result-label">Actual Result</div>
        ${scoreLine}
        ${scorersHtml}
      </div>`;
  } else {
    resultHtml = `<div class="mc-awaiting">⏳ Awaiting result...</div>`;
  }

  // Table headers — only show AET/Pens columns if match went to AET
  const showAET = hasAET || isKnockout;
  const showPens = hasPens || isKnockout;

  const tableHeaders = `
    <tr>
      <th>Player</th>
      <th>Winner</th>
      <th>Score</th>
      <th class="hide-mobile">Scorers</th>
      ${showAET ? '<th class="hide-mobile">AET Score</th>' : ''}
      ${showAET ? '<th class="hide-mobile">ET Scorers</th>' : ''}
      ${showPens ? '<th class="hide-mobile">Pens</th>' : ''}
      <th class="right">Pts</th>
    </tr>`;

  // Player rows
  const players = playerList.length > 0 ? playerList : Object.keys(data.players || {});
  let playerRows = '';

  players.forEach(pName => {
    const pred = (data.players && data.players[pName]) || null;
    const isMe = pName === myName;
    const hasPred = pred && pred.winner;
    const pts = pred ? pred.points : null;

    let winnerCell = '<span class="mc-empty">—</span>';
    let scoreCell = '<span class="mc-empty">—</span>';
    let scorersCell = '<span class="mc-empty">—</span>';
    let aetCell = '<span class="mc-empty">—</span>';
    let etScorersCell = '<span class="mc-empty">—</span>';
    let pensCell = '<span class="mc-empty">—</span>';
    let ptsCell = '<span class="mc-pts-pending">no pick</span>';

    if (hasPred) {
      // Winner — colour based on correctness
      let winnerClass = '';
      if (hasResult) {
        winnerClass = pred.winner === result.winner ? 'correct' : 'incorrect';
      }
      winnerCell = `<span class="mc-pred-winner ${winnerClass}">${escHtml(pred.winner)}</span>`;

      // Score
      let scoreClass = '';
      if (hasResult && pred.score) {
        scoreClass = pred.score === result.score ? 'correct' : '';
      }
      scoreCell = pred.score
        ? `<span class="mc-pred-score ${scoreClass}">${escHtml(pred.score)}</span>`
        : '<span class="mc-empty">—</span>';

      // Scorers
      scorersCell = pred.scorers
        ? `<div class="mc-pred-scorers">${escHtml(pred.scorers)}</div>`
        : '<span class="mc-empty">—</span>';

      // AET
      if (showAET) {
        let aetClass = '';
        if (hasResult && pred.aetScore) {
          aetClass = pred.aetScore === result.aetScore ? 'correct' : '';
        }
        aetCell = pred.aetScore
          ? `<span class="mc-pred-aet ${aetClass}">${escHtml(pred.aetScore)}</span>`
          : '<span class="mc-empty">—</span>';

        etScorersCell = pred.etScorers
          ? `<div class="mc-pred-scorers">${escHtml(pred.etScorers)}</div>`
          : '<span class="mc-empty">—</span>';
      }

      // Pens
      if (showPens) {
        pensCell = pred.pensScore
          ? `<span class="mc-pred-pens">${escHtml(pred.pensScore)}</span>`
          : '<span class="mc-empty">—</span>';
      }

      // Points
      if (hasResult) {
        const ppTier = pred.ppTier || '';
        let ppBadge = '';
        if (ppTier === 'Silver') ppBadge = '<span class="mc-pp-badge mc-pp-silver">Silver PP</span>';
        if (ppTier === 'Golden') ppBadge = '<span class="mc-pp-badge mc-pp-golden">Golden PP</span>';
        if (ppTier === 'Platinum') ppBadge = '<span class="mc-pp-badge mc-pp-platinum">Platinum PP</span>';

        ptsCell = pts > 0
          ? `<span class="mc-pts mc-pts-pos">+${pts}</span>${ppBadge}`
          : `<span class="mc-pts mc-pts-zero">0</span>`;
      } else {
        ptsCell = '<span class="mc-pts-pending">pending</span>';
      }
    }

    playerRows += `
      <tr>
        <td><span class="mc-player-name${isMe ? ' is-me' : ''}">${escHtml(pName)}${isMe ? ' <span style="font-size:0.7rem;opacity:0.6">(you)</span>' : ''}</span></td>
        <td>${winnerCell}</td>
        <td>${scoreCell}</td>
        <td class="hide-mobile">${scorersCell}</td>
        ${showAET ? `<td class="hide-mobile">${aetCell}</td>` : ''}
        ${showAET ? `<td class="hide-mobile">${etScorersCell}</td>` : ''}
        ${showPens ? `<td class="hide-mobile">${pensCell}</td>` : ''}
        <td style="text-align:right;">${ptsCell}</td>
      </tr>`;
  });

  const bodyHtml = `
    <div class="mc-body" id="mc-body-${matchId}">
      ${resultHtml}
      <div style="overflow-x:auto;">
        <table class="mc-table">
          <thead>${tableHeaders}</thead>
          <tbody>
            ${playerRows || '<tr class="mc-loading-row"><td colspan="8">No prediction data available</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;

  return `
    <div class="mc-card" id="mc-card-${matchId}">
      <div class="mc-match-header" onclick="toggleMcCard(${matchId})">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
          <span class="mc-match-id">Match ${matchId}</span>
          <span class="mc-match-title">${escHtml(home)} <span class="vs">vs</span> ${escHtml(away)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
          ${hasResult
            ? `<span style="font-size:0.82rem;color:var(--gold);font-weight:600;">${escHtml(result.winner)} ${escHtml(result.score)}</span>`
            : `<span style="font-size:0.78rem;color:var(--text3);">Awaiting result</span>`}
          <span class="mc-match-time">${formatKickoffShort(kickoffUTC)}</span>
          <svg class="mc-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      ${bodyHtml}
    </div>`;
}

function toggleMcCard(matchId) {
  const card = document.getElementById(`mc-card-${matchId}`);
  const body = document.getElementById(`mc-body-${matchId}`);
  const isExpanded = card.classList.contains('expanded');

  // Collapse all others
  document.querySelectorAll('.mc-card.expanded').forEach(c => {
    if (c.id !== `mc-card-${matchId}`) c.classList.remove('expanded');
  });

  card.classList.toggle('expanded', !isExpanded);
}
</script>
</body>
</html>
